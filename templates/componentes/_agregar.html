{# Formulario "Agregar" al carrito. Uso: include con p=producto #}
{% if not p.disponible %}
  <button class="btn btn-secundario chico" type="button" disabled>Agotado</button>
{% elif user.is_authenticated and not user.es_admin %}
  <form method="post" action="{% url 'carrito:agregar' p.pk %}" class="en-linea js-agregar">{% csrf_token %}
    <input type="hidden" name="cantidad" value="1"><button class="btn chico">Agregar</button>
  </form>
{% elif not user.is_authenticated %}
  <a class="btn chico" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Agregar</a>
{% endif %}
