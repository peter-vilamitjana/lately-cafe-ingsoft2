<div class="tabla-scroll"><table>
  <thead><tr><th>Artículo</th><th>Precio</th><th>Cant.</th><th>Subtotal</th></tr></thead>
  <tbody>
  {% for i in items %}
    <tr><td>{{ i.nombre_producto|default:i.producto.nombre }}</td><td>${{ i.precio_unitario|default:i.producto.precio }}</td><td>{{ i.cantidad }}</td><td>${{ i.subtotal }}</td></tr>
  {% endfor %}
  </tbody>
  <tfoot><tr><th colspan="3">Total</th><th>${{ total }}</th></tr></tfoot>
</table></div>
